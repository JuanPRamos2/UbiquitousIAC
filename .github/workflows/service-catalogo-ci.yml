name: service-catalogo
on:
  push:
    paths:
      - "ejercicio03/library_soap_service/**"
      - "services/service-catalogo/**"
      - "app.py"
      - "requirements.txt"
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest ejercicio03/library_soap_service/tests -q
