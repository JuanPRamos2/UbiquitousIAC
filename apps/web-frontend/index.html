<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo JSON</title>
</head>
<body>
  <h1>/books?format=json</h1>
  <pre id="out">Cargando…</pre>
  <script>
    fetch("http://127.0.0.1:5001/books?format=json")
      .then((r) => r.json())
      .then((d) => { document.getElementById("out").textContent = JSON.stringify(d, null, 2); })
      .catch((e) => { document.getElementById("out").textContent = String(e); });
  </script>
</body>
</html>
