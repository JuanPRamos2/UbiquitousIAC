services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: "666"
    ports:
      - "5433:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
      - ../../data/database:/sql:ro
      - ../../data/database/docker-init.sh:/docker-entrypoint-initdb.d/init-library.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "libreria-redis", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - library_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "libreria-redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  library_pgdata:
  library_redis:
