<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#f8fafc"/>
  <text x="700" y="40" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#111827">Macro-arquitectura monolitica - Libreria /library</text>
  <text x="700" y="68" text-anchor="middle" font-family="Arial" font-size="14" fill="#4b5563">Una sola unidad desplegable: presentacion + logica + datos en el mismo proceso Node.js</text>
  <rect x="40" y="110" width="200" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="140" y="150" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Navegador</text>
  <text x="140" y="175" text-anchor="middle" font-family="Arial" font-size="12">HTML / formularios</text>
  <rect x="310" y="110" width="240" height="90" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="430" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Apache / NGINX</text>
  <text x="430" y="170" text-anchor="middle" font-family="Arial" font-size="12">Reverse proxy /library</text>
  <text x="430" y="188" text-anchor="middle" font-family="Arial" font-size="12">Puerto 80 a 127.0.0.1:3000</text>
  <rect x="620" y="90" width="520" height="430" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="880" y="120" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Proceso Node.js / Express (monolito)</text>
  <rect x="650" y="145" width="220" height="70" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="760" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">views/ (EJS)</text>
  <text x="760" y="195" text-anchor="middle" font-family="Arial" font-size="11">Presentacion SSR</text>
  <rect x="890" y="145" width="220" height="70" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="1000" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">public/ + uploads/</text>
  <text x="1000" y="195" text-anchor="middle" font-family="Arial" font-size="11">Estaticos e imagenes</text>
  <rect x="650" y="235" width="460" height="70" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="880" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">routes / middleware</text>
  <text x="880" y="285" text-anchor="middle" font-family="Arial" font-size="11">HTTP, sesion, authn/authz, validacion, errores</text>
  <rect x="650" y="325" width="460" height="70" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="880" y="355" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">services/</text>
  <text x="880" y="375" text-anchor="middle" font-family="Arial" font-size="11">Reglas de negocio y llamadas parametrizadas / SP</text>
  <rect x="650" y="415" width="460" height="70" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="880" y="445" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">config/db.js (pg)</text>
  <text x="880" y="465" text-anchor="middle" font-family="Arial" font-size="11">Pool de conexiones; secretos en entorno</text>
  <rect x="620" y="560" width="250" height="90" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="745" y="600" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">PostgreSQL</text>
  <text x="745" y="625" text-anchor="middle" font-family="Arial" font-size="12">Tablas 4FN, SP, triggers, vistas</text>
  <rect x="900" y="560" width="240" height="90" rx="10" fill="#ffe4e6" stroke="#be123c"/>
  <text x="1020" y="600" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Disco uploads/</text>
  <text x="1020" y="625" text-anchor="middle" font-family="Arial" font-size="12">Archivos; metadatos en BD</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>
  <line x1="240" y1="155" x2="310" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="155" x2="620" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="485" x2="745" y2="560" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="215" x2="1020" y2="560" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="720" font-family="Arial" font-size="13" fill="#374151">No hay API REST/GraphQL/SOAP. El navegador envia formularios HTML al monolito y recibe HTML.</text>
  <text x="40" y="742" font-family="Arial" font-size="13" fill="#374151">Juan Pablo Ramos Salazar 610248 - Integracion de Aplicaciones Computacionales 2026</text>
</svg>
