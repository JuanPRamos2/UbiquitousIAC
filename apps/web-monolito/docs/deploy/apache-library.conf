# Reverse proxy /library — Apache httpd
# Requiere: mod_proxy, mod_proxy_http
# Copiar a /etc/httpd/conf.d/library.conf y recargar httpd.

<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyPass        /library http://127.0.0.1:3000/library
    ProxyPassReverse /library http://127.0.0.1:3000/library

    LimitRequestBody 6291456
</VirtualHost>
