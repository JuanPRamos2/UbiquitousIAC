services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: "666"
    ports:
      - "5432:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
      - ./db:/sql:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/init-library.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  library_pgdata:
