<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="750" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Modelo ER final 4FN</text>
  <text x="750" y="60" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b5563">Tablas puente para autores, generos, imagenes y conceptos (definicion por libro)</text>
  <g font-family="Arial" font-size="13">
    <rect x="40" y="100" width="200" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="140" y="135" text-anchor="middle" font-weight="700">FORMATS</text>
    <text x="140" y="158" text-anchor="middle">id PK, name UQ</text>
    <rect x="40" y="220" width="200" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="140" y="255" text-anchor="middle" font-weight="700">CATEGORIES</text>
    <text x="140" y="278" text-anchor="middle">id PK, name UQ</text>
    <rect x="360" y="160" width="280" height="150" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="500" y="195" text-anchor="middle" font-weight="700">BOOKS</text>
    <text x="500" y="220" text-anchor="middle">id PK, isbn UQ</text>
    <text x="500" y="242" text-anchor="middle">title, year, price&gt;=0, stock&gt;=0</text>
    <text x="500" y="264" text-anchor="middle">format_id FK, category_id FK</text>
    <rect x="760" y="90" width="210" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="865" y="125" text-anchor="middle" font-weight="700">AUTHORS</text>
    <text x="865" y="148" text-anchor="middle">id PK, full_name UQ</text>
    <rect x="760" y="210" width="210" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="865" y="245" text-anchor="middle" font-weight="700">GENRES</text>
    <text x="865" y="268" text-anchor="middle">id PK, name UQ</text>
    <rect x="760" y="330" width="210" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="865" y="365" text-anchor="middle" font-weight="700">CONCEPTS</text>
    <text x="865" y="388" text-anchor="middle">id PK, name UQ</text>
    <rect x="760" y="450" width="210" height="90" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="865" y="485" text-anchor="middle" font-weight="700">IMAGES</text>
    <text x="865" y="508" text-anchor="middle">stored_name UQ, mime, size</text>
    <rect x="1040" y="90" width="240" height="90" rx="8" fill="#ffe4e6" stroke="#be123c"/>
    <text x="1160" y="122" text-anchor="middle" font-weight="700">BOOK_AUTHORS</text>
    <text x="1160" y="145" text-anchor="middle">PK (book_id, author_id)</text>
    <text x="1160" y="165" text-anchor="middle">4FN ISBN-autor M:N</text>
    <rect x="1040" y="210" width="240" height="90" rx="8" fill="#ffe4e6" stroke="#be123c"/>
    <text x="1160" y="242" text-anchor="middle" font-weight="700">BOOK_GENRES</text>
    <text x="1160" y="265" text-anchor="middle">PK (book_id, genre_id)</text>
    <text x="1160" y="285" text-anchor="middle">4FN ISBN-genero M:N</text>
    <rect x="1040" y="330" width="240" height="110" rx="8" fill="#ffe4e6" stroke="#be123c"/>
    <text x="1160" y="360" text-anchor="middle" font-weight="700">BOOK_CONCEPTS</text>
    <text x="1160" y="383" text-anchor="middle">PK (book, concept)</text>
    <text x="1160" y="405" text-anchor="middle">definition, chapter, page</text>
    <text x="1160" y="425" text-anchor="middle">definicion depende del par</text>
    <rect x="1040" y="460" width="240" height="100" rx="8" fill="#ffe4e6" stroke="#be123c"/>
    <text x="1160" y="492" text-anchor="middle" font-weight="700">BOOK_IMAGES</text>
    <text x="1160" y="515" text-anchor="middle">PK (book_id, image_id)</text>
    <text x="1160" y="537" text-anchor="middle">is_cover (max 1 por libro)</text>
    <rect x="360" y="430" width="280" height="120" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="500" y="465" text-anchor="middle" font-weight="700">USERS</text>
    <text x="500" y="490" text-anchor="middle">email UQ, password_hash</text>
    <text x="500" y="512" text-anchor="middle">role IN (admin, client)</text>
    <text x="500" y="534" text-anchor="middle">UNIQUE parcial: un solo admin</text>
  </g>
  <text x="40" y="640" font-family="Arial" font-size="14" font-weight="700">Por que no van listas dentro de books</text>
  <text x="40" y="668" font-family="Arial" font-size="13">Autores, generos, imagenes y conceptos son independientes. Listas o columnas repetidas provocan MVD.</text>
  <text x="40" y="692" font-family="Arial" font-size="13">La definicion de IaaS en Cloud Computing vive en BOOK_CONCEPTS, no solo en CONCEPTS.</text>
  <text x="40" y="730" font-family="Arial" font-size="13" fill="#374151">ON DELETE: catalogos RESTRICT. Puentes del libro CASCADE.</text>
  <text x="40" y="770" font-family="Arial" font-size="13" fill="#4b5563">Juan Pablo Ramos Salazar 610248 - Ejercicio guiado 02 - 2026</text>
</svg>
