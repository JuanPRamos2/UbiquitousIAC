<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura SOAP + monolito + PostgreSQL</title>
  <desc id="desc">La aplicación de escritorio y el cliente zeep hablan SOAP/HTTP con Flask. El monolito Node.js sigue accediendo a PostgreSQL por su cuenta. El módulo SOAP usa psycopg2 y tablas propias.</desc>
  <rect width="1100" height="640" fill="#f3efe8"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#24332b">Macro-arquitectura · ejercicio guiado 3</text>
  <text x="40" y="66" font-family="Segoe UI, sans-serif" font-size="13" fill="#6a635a">Fronteras de aplicación, protocolos y dueño de cada responsabilidad</text>

  <rect x="40" y="90" width="240" height="150" rx="16" fill="#fffcf8" stroke="#3c5344" stroke-width="2"/>
  <text x="160" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#24332b">App de escritorio</text>
  <text x="160" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#3c5344">Java Swing</text>
  <text x="160" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#6a635a">Motor local IaaSFaaS</text>
  <text x="160" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#6a635a">Cliente SOAP (DOM XML)</text>
  <text x="160" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c7a68">Dueño: GUI y clasificación local</text>

  <rect x="40" y="270" width="240" height="110" rx="16" fill="#fffcf8" stroke="#5c7a68" stroke-width="2"/>
  <text x="160" y="304" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#24332b">Cliente zeep</text>
  <text x="160" y="328" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#6a635a">Python · WSDL-first</text>
  <text x="160" y="352" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c7a68">Dueño: evidencia de interoperabilidad</text>

  <rect x="400" y="150" width="280" height="230" rx="16" fill="#24332b"/>
  <text x="540" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e4d4b4">Módulo SOAP Flask</text>
  <text x="540" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#c9d4cc">HTTP POST · text/xml</text>
  <text x="540" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#c9d4cc">xml.etree Envelope</text>
  <text x="540" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#c9d4cc">WSDL + XSD</text>
  <text x="540" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#c9d4cc">WS-Security · SOAP Fault</text>
  <text x="540" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#c9d4cc">psycopg2 + SP/vistas</text>
  <text x="540" y="346" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#b9a88c">Dueño: contrato e integración</text>

  <rect x="800" y="90" width="260" height="150" rx="16" fill="#fffcf8" stroke="#8a6a4a" stroke-width="2"/>
  <text x="930" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#24332b">Monolito web</text>
  <text x="930" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#3c5344">Node.js + Express + EJS</text>
  <text x="930" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#6a635a">Sin cambios en este ejercicio</text>
  <text x="930" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c7a68">Dueño: catálogo y usuarios web</text>

  <rect x="400" y="430" width="280" height="150" rx="16" fill="#3c5344"/>
  <text x="540" y="470" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fff">PostgreSQL</text>
  <text x="540" y="498" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7ece9">Tablas del monolito (sólo lectura SOAP)</text>
  <text x="540" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7ece9">clasificadores · clasificaciones_cloud</text>
  <text x="540" y="542" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#e7ece9">clientes_servidos</text>
  <text x="540" y="562" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#b9a88c">Dueño de datos: BD compartida, no el código Node</text>

  <line x1="280" y1="165" x2="400" y2="220" stroke="#3c5344" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="178" font-family="Segoe UI, sans-serif" font-size="11" fill="#3c5344">SOAP/XML</text>
  <line x1="280" y1="325" x2="400" y2="300" stroke="#5c7a68" stroke-width="2"/>
  <text x="300" y="318" font-family="Segoe UI, sans-serif" font-size="11" fill="#5c7a68">WSDL + SOAP</text>
  <line x1="540" y1="380" x2="540" y2="430" stroke="#b9a88c" stroke-width="3"/>
  <text x="552" y="412" font-family="Segoe UI, sans-serif" font-size="11" fill="#6a635a">psycopg2</text>
  <line x1="800" y1="240" x2="680" y2="430" stroke="#8a6a4a" stroke-width="2"/>
  <text x="760" y="330" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a6a4a">pg (sin SOAP)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3c5344"/>
    </marker>
  </defs>
</svg>
