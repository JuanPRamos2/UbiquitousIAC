<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="t d">
  <title id="t">Contrato WSDL</title>
  <desc id="d">El WSDL expone cuatro operaciones y oculta el resto del catálogo.</desc>
  <rect width="1100" height="360" fill="#f3efe8"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#24332b">Contrato público · library-classifier.wsdl</text>
  <rect x="40" y="80" width="240" height="230" rx="16" fill="#fffcf8" stroke="#4d6b8a" stroke-width="2"/>
  <text x="160" y="120" text-anchor="middle" font-weight="700" font-family="Segoe UI, sans-serif" fill="#24332b">Pendientes</text>
  <text x="160" y="150" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6a635a">ISBN, título,</text>
  <text x="160" y="170" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6a635a">concepto, categoría</text>
  <rect x="300" y="80" width="240" height="230" rx="16" fill="#fffcf8" stroke="#5c7a68" stroke-width="2"/>
  <text x="420" y="120" text-anchor="middle" font-weight="700" font-family="Segoe UI, sans-serif" fill="#24332b">Registrar</text>
  <text x="420" y="150" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6a635a">clasificador + concepto</text>
  <text x="420" y="170" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6a635a">+ IaaS/PaaS/SaaS/FaaS</text>
  <rect x="560" y="80" width="240" height="230" rx="16" fill="#fffcf8" stroke="#8a6a4a" stroke-width="2"/>
  <text x="680" y="120" text-anchor="middle" font-weight="700" font-family="Segoe UI, sans-serif" fill="#24332b">Progreso</text>
  <text x="680" y="150" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6a635a">clasificados</text>
  <text x="680" y="170" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6a635a">y pendientes</text>
  <rect x="820" y="80" width="240" height="230" rx="16" fill="#24332b"/>
  <text x="940" y="120" text-anchor="middle" font-weight="700" font-family="Segoe UI, sans-serif" fill="#e4d4b4">Estadísticas</text>
  <text x="940" y="150" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#c9d4cc">conteo por modelo</text>
  <text x="940" y="178" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#b9a88c">WS-Security</text>
  <text x="40" y="340" font-family="Segoe UI, sans-serif" font-size="13" fill="#6a635a">No se exponen precios, existencias, cuentas de la librería ni credenciales.</text>
</svg>
