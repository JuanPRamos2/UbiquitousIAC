openapi: 3.0.3
info:
  title: Catálogo de la librería
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:5001
paths:
  /books:
    get:
      summary: Lista el catálogo
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, xml]
          description: json devuelve JSON; omitido o xml devuelve XML
        - in: query
          name: format-json
          schema:
            type: boolean
          description: Alias para JSON
      responses:
        "200":
          description: Catálogo
    post:
      summary: Alta (admin)
      parameters:
        - in: header
          name: X-User-Role
          schema: { type: string, enum: [admin] }
      responses:
        "201": { description: Creado }
        "403": { description: No admin }
  /books/{isbn}:
    get:
      summary: Un libro
      parameters:
        - in: path
          name: isbn
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string }
    put:
      summary: Cambio (admin)
    delete:
      summary: Baja (admin)
