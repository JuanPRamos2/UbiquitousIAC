# ARCHIVO GENERADO — no editar a mano.
#
# Lo produce contratos/generar_openapi_node.py a partir de
# comun/openapi.py, que es la misma definicion de seguridad, sobre de error
# y codigos HTTP que usan los seis microservicios en Python. Para cambiar
# este contrato se edita el generador y se vuelve a ejecutar:
#
#     python3 contratos/generar_openapi_node.py
#
openapi: 3.0.3
info:
  title: catalog-service — Bienestar Nexum
  version: 1.0.0
  description: "CRUD de unidades organizacionales, instrumentos, versiones, reactivos y\ncampañas sobre\
    \ PostgreSQL. **Integrante 2 (Ricardo Arath Sánchez Aguirre).**\n\nTres decisiones que recorren todo\
    \ el servicio:\n\n1. **La baja es lógica.** `DELETE` marca la entidad inactiva y la devuelve;\n  \
    \ nunca borra. Un borrado real rompería las llaves foráneas de las\n   respuestas ya registradas,\
    \ o dejaría huérfano el histórico de agregados.\n   Las únicas excepciones son las tablas de relación\
    \ (`reactivo_version`,\n   `campania_unidad`), donde desasociar no destruye nada.\n\n2. **La autorización\
    \ se expresa con permisos, no con perfiles.** El día que\n   el equipo cree un perfil nuevo (\"coordinador\
    \ de turno\") basta con\n   asignarle permisos en `usuarios.perfil_permiso` y estas rutas lo aceptan\n\
    \   sin recompilar. Si la lista fuera de perfiles, habría que editar el\n   código y volver a desplegar.\n\
    \n3. **Leer el catálogo también exige token.** El catálogo revela la\n   estructura organizacional\
    \ de la empresa, incluida la plantilla declarada\n   de cada unidad.\n\nLa caché en Redis se invalida\
    \ en cada mutación y cada listado informa, en\nla cabecera `X-Cache` y en el campo `desde_cache`,\
    \ si la respuesta salió de\nla caché o de la base.\n\nTodas las respuestas existen en JSON y en XML:\
    \ `Accept: application/xml` o\n`?formato=xml`. El XML valida contra `contratos/xml/catalogos.xsd`.\n"
  contact:
    name: Equipo 03 — Proyecto 4
    email: equipo03@udem.edu.mx
servers:
- url: http://localhost:8103
  description: developer
- url: https://api.bienestar-nexum.mx
  description: production
tags:
- name: Unidades
  description: Árbol organizacional.
- name: Instrumentos
  description: Instrumentos psicométricos.
- name: Versiones
  description: Versiones y sus reactivos.
- name: Reactivos
  description: Preguntas del instrumento.
- name: Campanias
  description: Campañas de medición.
- name: Apoyo
  description: Catálogos de solo lectura.
security:
- bearerAuth: []
paths:
  /api/v1/catalogos/unidades:
    get:
      tags:
      - Unidades
      summary: Listar unidades
      description: 'Lectura abierta a los cinco perfiles, cada uno por un motivo distinto: el colaborador
        para ver los reactivos que va a responder, el líder y el especialista para interpretar un agregado,
        el auditor para revisar qué instrumento se aplicó, el administrador para operar. Aun así exige
        token: el catálogo revela la estructura de la empresa.'
      parameters:
      - &id009
        name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Numero de pagina, empezando en 1.
      - &id010
        name: tamano
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Elementos por pagina. El tope de 100 evita que una sola peticion pida un volumen
          que tumbe el servicio.
      - &id011
        name: formato
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - xml
        description: Alternativa al encabezado Accept, util para probar desde el navegador.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Alias de 'pagina'.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        description: Alias de 'tamano'.
      - &id008
        name: formato
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - xml
        description: Alternativa a la cabecera Accept, para poder pedir XML desde la barra de direcciones
          del navegador durante la demostracion.
      responses:
        '200':
          description: Página de unidades
          headers:
            X-Cache:
              description: ACIERTO si la respuesta salió de Redis.
              schema:
                type: string
                enum:
                - ACIERTO
                - FALLO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUnidades'
            application/xml:
              schema:
                type: string
              example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<unidades_respuesta xmlns=\"http://nexum.com.mx/bienestar/v1\"\
                >\n  <unidades>…</unidades>\n  <paginacion>…</paginacion>\n</unidades_respuesta>"
        '400': &id001
          $ref: '#/components/responses/SolicitudInvalida'
        '401': &id002
          $ref: '#/components/responses/NoAutenticado'
        '403': &id003
          $ref: '#/components/responses/SinPermiso'
        '404': &id004
          $ref: '#/components/responses/NoEncontrado'
        '422': &id005
          $ref: '#/components/responses/ValidacionFallida'
        '429': &id006
          $ref: '#/components/responses/LimiteExcedido'
        '500': &id007
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
      - Unidades
      summary: Crear unidad
      description: Exige el permiso UNIDAD_ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadOrganizacional'
              required:
              - unidad_organizacional_id
              - nombre
            example:
              unidad_organizacional_id: UO-CC-TURNO-C
              nombre: Call Center - Turno C
              tipo: TURNO
              unidad_padre_id: UO-OPERACIONES
              plantilla_declarada: 18
      responses:
        '201':
          description: Unidad creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadOrganizacional'
            application/xml:
              schema:
                type: string
              example: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<unidad_respuesta xmlns=\"http://nexum.com.mx/bienestar/v1\"\
                >\n  <unidad>…</unidad>\n</unidad_respuesta>"
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '422': *id005
        '429': *id006
        '500': *id007
