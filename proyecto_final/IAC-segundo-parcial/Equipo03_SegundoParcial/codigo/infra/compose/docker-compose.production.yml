# Ambiente PRODUCTION — el que se demuestra y el que guarda datos reales.
#
# Reglas que este archivo hace cumplir:
#   1. La base de datos NO publica ningún puerto al host. Solo la red
#      interna del proyecto la alcanza. Es la regla de oro de la
#      topología del documento de arquitectura de hardware.
#   2. No se monta código: corre exactamente la imagen construida y
#      etiquetada con una versión, nunca "local".
#   3. Los secretos llegan por archivo, no por variable en texto plano.
#   4. Cuatro procesos de trabajo, que es la configuración sobre la que
#      se midieron los 117 peticiones/s de saturación.
#   5. Los límites de memoria corresponden al dimensionamiento medido:
#      4 GB para datos, 2 GB para la aplicación.

services:

  datos:
    # Sin sección "ports": deliberado, no es un olvido.
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_clave_super
    secrets:
      - pg_clave_super
    volumes:
      - respaldos:/respaldos
    shm_size: 256m
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
      -c log_min_duration_statement=500
    deploy:
      resources:
        limits:
          memory: 4g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  cache:
    command: >
      redis-server
      --appendonly no
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: bienestar-nexum/web:${VERSION:?en production la versión es obligatoria}
    environment:
      APP_AMBIENTE: production
      GUNICORN_WORKERS: 4
      NIVEL_BITACORA: INFO
      MOSTRAR_ERRORES: "false"
    deploy:
      resources:
        limits:
          memory: 2g
      replicas: ${API_REPLICAS:-1}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - certificados:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - publica
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  respaldos:
  certificados:

secrets:
  pg_clave_super:
    file: ../secretos/pg_clave_super.txt
