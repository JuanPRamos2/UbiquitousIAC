# En GCP la terminación de TLS ocurre en Cloud Load Balancing. Este proxy
# existe para que el camino sea idéntico al de staging y para aplicar los
# encabezados de seguridad aunque el balanceador cambie.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "same-origin"      always;

    # Las sondas no se registran en bitácora: son cada 15 segundos.
    location /salud { proxy_pass http://web:8000/salud; access_log off; }
    location /listo { proxy_pass http://web:8000/listo; access_log off; }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
