server {
    listen 80;
    server_name _;

    # Staging no tiene TLS propio: se prueba el camino, no el certificado.
    location /salud  { proxy_pass http://web:8000/salud;  access_log off; }
    location /listo  { proxy_pass http://web:8000/listo;  access_log off; }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
